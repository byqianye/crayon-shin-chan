[package]
name = "crayon-rust"
version = "0.1.8"
edition = "2024"
publish = false
license = "MIT"
description = "蜡笔小新 Rust 桌面客户端"

[features]
default = ["desktop"]
desktop = ["dep:dioxus", "dep:rfd", "dep:image"]

[lib]
name = "crayon_core"
path = "src/lib.rs"

[[bin]]
name = "crayon-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
dioxus = { version = "=0.7.10", default-features = false, features = ["desktop", "minimal", "document"], optional = true }
encoding_rs = "0.8"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
json5 = "0.4"
md5 = "0.7"
opener = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "stream", "socks"] }
rfd = { version = "0.15", optional = true }
roxmltree = "0.20"
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "=0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
