name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Rust release version without the v prefix
        required: true
        default: 0.1.8

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_DISABLE_GPU: '1'

jobs:
  package:
    name: Windows Rust release assets
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME -replace '^v', '' } else { $env:INPUT_VERSION -replace '^v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          node scripts/release-check.mjs --source-only --rust --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Source version check failed' }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Spider runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm spider:deps
          pnpm spider:build
          pnpm spider:unidbg
          pnpm spider:runtime
      - name: Verify reference implementation
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm typecheck
          pnpm icon:check
          node scripts/service-regression.mjs
          node scripts/spider-contract.mjs
          node scripts/check-lockfile.mjs
          node scripts/check-ci.mjs
          pnpm build
          node scripts/ci-selftest.mjs
      - name: Verify Rust implementation
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path native-rust/Cargo.toml -- --check
          cargo check --locked --manifest-path native-rust/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path native-rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path native-rust/Cargo.toml --tests
          cargo test --locked --manifest-path native-rust/Cargo.toml --no-default-features
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path -LiteralPath $nsis)) { throw 'NSIS compiler not found' }
          "MAKENSIS_PATH=$nsis" >> $env:GITHUB_ENV
      - name: Package Rust Windows installer
        run: pnpm package:rust
      - name: Verify Rust release and generate notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/release-check.mjs --rust --version $env:RELEASE_VERSION --write-checksums
          node scripts/release-notes.mjs --rust --version $env:RELEASE_VERSION --write
      - name: Upload selftest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-selftest-logs
          path: |
            ${{ runner.temp }}/dev.log
            ${{ runner.temp }}/dev.err.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Rust workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrayonShinChan-Rust-${{ steps.version.outputs.version }}
          path: |
            release/rust/CrayonShinChan-${{ steps.version.outputs.version }}-rust-x64.exe
            release/rust/CrayonShinChan-${{ steps.version.outputs.version }}-rust-x64.zip
            release/rust/SHA256SUMS-rust.txt
            release/rust/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Publish draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: CrayonShinChan-Rust-${{ needs.package.outputs.version }}
          path: release-assets
      - name: Create or update Rust release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $notes = Join-Path 'release-assets' 'RELEASE_NOTES.md'
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Missing release notes' }
          $files = @(
            "release-assets/CrayonShinChan-$env:RELEASE_VERSION-rust-x64.exe",
            "release-assets/CrayonShinChan-$env:RELEASE_VERSION-rust-x64.zip",
            'release-assets/SHA256SUMS-rust.txt'
          )
          if (-not $files) { throw '没有找到可上传的发布资产' }
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "发布资产不完整：$file" }
          }
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG @files --verify-tag --draft --title "蜡笔小新 $env:RELEASE_TAG · Rust" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Create draft failed' }
          } else {
            $view = $existing | ConvertFrom-Json
            if (-not $view.isDraft) {
              Write-Output '目标版本已经是正式 Release，拒绝自动覆盖。'
              exit 0
            }
            gh release edit $env:RELEASE_TAG --draft --title "蜡笔小新 $env:RELEASE_TAG · Rust" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Update draft failed' }
            gh release upload $env:RELEASE_TAG @files --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Upload draft assets failed' }
          }
