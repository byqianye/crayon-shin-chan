name: Spider Live Matrix

# 真实源矩阵不和每次提交绑定：源站会挂、会改版，定时跑出报告即可。
on:
  schedule:
    # 每周一 02:00（北京时间）跑一次
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: 真实 Spider 矩阵
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 下载宿主编译依赖
        run: pnpm spider:deps

      - name: 编译宿主
        run: pnpm spider:build

      - name: 跑真实源矩阵
        run: node scripts/spider-matrix.mjs --cases spider-tests/cases.json --out spider-reports

      - name: 保存矩阵报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spider-matrix
          path: spider-reports/
          if-no-files-found: warn
          retention-days: 14
