name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI 在境外网络，直接用官方源，避免国内镜像带来的额外跳转
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

jobs:
  quality:
    name: 类型检查 / 构建 / 脚本语法
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 校验锁文件
        run: node scripts/check-lockfile.mjs

      - name: 校验工作流约束
        run: node scripts/check-ci.mjs

      - name: 构建产物
        run: pnpm build

      - name: 检查脚本语法
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem -Path scripts -Filter *.mjs -File | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          node --check scripts/ensure-electron.cjs
          if ($LASTEXITCODE -ne 0) { $failed += 'ensure-electron.cjs' }
          if ($failed.Count -gt 0) { throw "语法检查失败：$($failed -join ', ')" }

      - name: 校验版本与 CHANGELOG 同步
        run: node scripts/release-check.mjs --source-only

  spider-host:
    name: Spider 宿主编译
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 下载宿主依赖
        run: pnpm spider:deps

      - name: 编译宿主
        run: pnpm spider:build

      - name: 编译 unidbg 桥
        run: pnpm spider:unidbg

      - name: 断言编译产物齐全
        shell: pwsh
        run: |
          $required = @(
            'spider-host/out/host/SpiderHost.class',
            'spider-host/out/com/github/catvod/crawler/Spider.class',
            'spider-host/unidbg-out/host/FishGuardBridge.class',
            'spider-host/lib/android-4.1.1.4.jar',
            'spider-host/lib/json-20090211.jar',
            'spider-host/dex-tools/dex-tools-v2.4/lib'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "缺少产物：$($missing -join ', ')" }

  selftest:
    name: 端到端自检
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 启动开发窗口
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'dev.log'
          $err = Join-Path $env:RUNNER_TEMP 'dev.err.log'
          $process = Start-Process -FilePath 'node' `
            -ArgumentList @('node_modules/electron-vite/bin/electron-vite.js', 'dev', '--', '--remote-debugging-port=9222') `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -WindowStyle Hidden `
            -RedirectStandardOutput $log `
            -RedirectStandardError $err `
            -PassThru
          $process.Id | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'dev.pid') -Encoding ascii

      - name: 等待调试端口
        shell: pwsh
        run: |
          # runner 首次运行 Electron 需要初始化 GPU 缓存并下载/解压二进制，
          # 实测可能超过 6 分钟，因此按 10 分钟窗口轮询，并在超时时打印日志。
          $log = Join-Path $env:RUNNER_TEMP 'dev.log'
          $err = Join-Path $env:RUNNER_TEMP 'dev.err.log'
          for ($i = 0; $i -lt 200; $i++) {
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:9222/json/version' -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { Write-Host 'CDP 已就绪'; exit 0 }
            } catch {
              if ($i % 15 -eq 0) {
                $tail = (Get-Content $log -Tail 3 -ErrorAction SilentlyContinue) -join ' / '
                Write-Host "[wait $i] $tail"
              }
              Start-Sleep -Seconds 3
            }
          }
          Get-Content $log -Tail 100 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 60 -ErrorAction SilentlyContinue
          throw '调试端口 9222 在 600 秒内没有就绪'

      - name: 跑端到端自检
        run: node scripts/selftest.mjs

      - name: 关闭开发窗口
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP 'dev.pid'
          if (Test-Path $pidFile) {
            $devPid = (Get-Content $pidFile | Select-Object -First 1).Trim()
            if ($devPid) { taskkill /PID $devPid /T /F 2>$null }
          }
          Get-Process electron -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: 保存失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-logs
          path: |
            ${{ runner.temp }}/dev.log
            ${{ runner.temp }}/dev.err.log
          if-no-files-found: ignore
          retention-days: 7
