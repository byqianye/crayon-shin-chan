name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI 在境外网络，直接用官方源，避免国内镜像带来的额外跳转
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  # runner 没有 GPU，Electron 缺这组开关会在启动阶段卡住
  ELECTRON_DISABLE_GPU: '1'

jobs:
  quality:
    name: 类型检查 / 构建 / 脚本语法
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 校验应用图标
        run: pnpm icon:check

      - name: 源适配与性能回归
        run: node scripts/service-regression.mjs

      - name: 校验锁文件
        run: node scripts/check-lockfile.mjs

      - name: 校验工作流约束
        run: node scripts/check-ci.mjs

      - name: 构建产物
        run: pnpm build

      - name: 检查脚本语法
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem -Path scripts -Filter *.mjs -File | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          node --check scripts/ensure-electron.cjs
          if ($LASTEXITCODE -ne 0) { $failed += 'ensure-electron.cjs' }
          if ($failed.Count -gt 0) { throw "语法检查失败：$($failed -join ', ')" }

      - name: 校验版本与 CHANGELOG 同步
        run: node scripts/release-check.mjs --source-only

  spider-host:
    name: Spider 宿主编译
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 下载宿主依赖
        run: pnpm spider:deps

      - name: 编译宿主
        run: pnpm spider:build

      - name: 编译 unidbg 桥
        run: pnpm spider:unidbg

      - name: 断言编译产物齐全
        shell: pwsh
        run: |
          $required = @(
            'spider-host/out/host/SpiderHost.class',
            'spider-host/out/com/github/catvod/crawler/Spider.class',
            'spider-host/unidbg-out/host/FishGuardBridge.class',
            'spider-host/lib/android-4.1.1.4.jar',
            'spider-host/lib/json-20090211.jar',
            'spider-host/dex-tools/dex-tools-v2.4/lib'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "缺少产物：$($missing -join ', ')" }

      - name: Spider 契约矩阵
        run: node scripts/spider-contract.mjs

  selftest:
    name: 端到端自检
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建生产包
        run: pnpm build

      - name: 跑端到端自检
        run: node scripts/ci-selftest.mjs

      - name: 保存失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-logs
          path: |
            ${{ runner.temp }}/dev.log
            ${{ runner.temp }}/dev.err.log
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust desktop quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare embedded assets and Spider
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm install --frozen-lockfile
          pnpm spider:deps
          pnpm spider:build
          pnpm spider:unidbg
          pnpm spider:runtime
      - name: Check and test Rust
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path native-rust/Cargo.toml -- --check
          cargo check --locked --manifest-path native-rust/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path native-rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path native-rust/Cargo.toml --tests
          cargo test --locked --manifest-path native-rust/Cargo.toml --no-default-features
          pnpm build:rust
